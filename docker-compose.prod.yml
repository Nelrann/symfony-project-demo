# Production configuration with automatic HTTPS via Caddy
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Ports are configurable via WEB_HTTP_PORT / WEB_HTTPS_PORT (defaults 8081/8443)
# NOTE : le stack n'a pas de container_name fixe → les names sont préfixés par le
# nom du projet compose (dossier) : plusieurs projects peuvent cohabiter sur un server.

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "${WEB_HTTP_PORT:-8081}:80"
      - "${WEB_HTTPS_PORT:-8443}:443"
      - "${WEB_HTTPS_PORT:-8443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      WEB_HTTPS_PORT: ${WEB_HTTPS_PORT:-8443}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - symfony
    depends_on:
      - nginx

  nginx:
    # Nginx no longer exposes ports; Caddy handles public traffic + HTTPS
    ports: !reset []
    restart: always
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    # Nom d'image dérivé du DOMAIN (.env.prod.local) : deux projects peuvent coexister
    # sur le même server sans collision de tag d'image.
    image: ${DOMAIN:-symfony-project}-prod
    # Injecte les secrets et variables de .env.prod.local dans le container
    # (APP_SECRET, MAILER_DSN, DEFAULT_URI, ...) : --env-file ne sert qu'à
    # l'interpolation par compose, pas à l'environnement du container.
    env_file:
      - .env.prod.local
    # var/tailwind contient le binaire Tailwind téléchargé (~80 Mo) : bind du
    # dossier MACHE (./var/tailwind, gitignore) pour ne PAS le re-télécharger à
    # chaque deploy — dans le container il serait perdu à chaque recreate.
    # Ownership : www du container = uid 1000 = user de deploy sur le serveur → les deux peuvent écrire.
    volumes: !override
      - ./var/tailwind:/var/www/html/var/tailwind
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      # Creds injectés depuis .env.prod.local (source .env.prod.local par deploy.sh),
      # sinon l'image utiliserait le .env baked avec des creds dev
      DATABASE_URL: "mysql://${DB_USER:-symfony}:${DB_PASSWORD:?DB_PASSWORD manquant dans .env.prod.local}@db:3306/${DB_NAME:-symfony}?serverVersion=8.0&charset=utf8mb4"

  db:
    restart: always
    ports: !reset []
    environment:
      MYSQL_DATABASE: ${DB_NAME:-symfony}
      MYSQL_USER: ${DB_USER:-symfony}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mailhog:
    profiles: ["debug"]

volumes:
  caddy_data:
  caddy_config:
