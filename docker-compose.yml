services:
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    networks:
      - symfony
    depends_on:
      db:
        condition: service_healthy
    # php-fpm ne démarre qu'après le composer install de l'entrypoint :
    # ce healthcheck permet à `docker compose up --wait` d'attendre la fin
    # de l'installation avant de lancer les commandes Doctrine/Composer.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'php-fpm: master' > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 120s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - symfony
    depends_on:
      - php

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: symfony
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    # Healthcheck : permet `docker compose up --wait` de ne pas rendre la main
    # avant que MySQL accepte les connexions (évite le "Connection refused" PDO
    # du premier démarrage, initialisation ~20-40s)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - symfony

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - symfony


volumes:

  db_data:

networks:
  symfony:
    driver: bridge
